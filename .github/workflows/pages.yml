name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; let an in-flight run finish rather than
# cancelling it mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      # Node runs the scansion/transliteration tests, the sandboxed app scripts
      # (test_runtime.py) and the jsdom smoke test. No browser is needed.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install test dependencies
        run: npm ci

      # Builds index.html from src/ and runs every suite (see scripts/check.sh).
      - name: Build and test
        run: npm test

      # The site serves the committed index.html, so it must match the sources.
      - name: Check committed build is up to date
        run: |
          if ! git diff --quiet -- index.html; then
            echo "::error::index.html is stale — run 'npm run build' and commit the result."
            git diff --stat -- index.html
            exit 1
          fi

      - name: Stage public site
        run: |
          mkdir -p _site
          cp index.html .nojekyll og-image.png CNAME _site/
          # Not published: src/ scripts/ data/ source_data/ docs/ tests/ —
          # everything the app needs is compiled into index.html.

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
