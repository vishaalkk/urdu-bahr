<!-- ===================== TRANSCRIBE (Route #/lab/transcribe) ===================== -->
<section id="transcribe-section" class="tab-view" style="display:none;">
  <div class="page-head">
    <h1 class="page-title">Transliterator</h1>
    <p class="lede dim small">Paste Roman, Urdu, Fārsī or Hindi, and read it in any of them.<span class="tr-lede-long"> Casual Roman too. Words no list knows are underlined: tap one to choose another spelling. <a href="#/letters">The letters it reads</a>.</span></p>
  </div>

  <div class="tr-grid">
    <!-- Left Column: Source / Input -->
    <div class="tr-col tr-col-in">
      <div class="tr-pane-head tr-in-head">
        <span class="eyebrow tr-pane-lbl">Input</span>
        <div id="trEmpty" class="scan-samples tr-samples">
          <span class="tiny muted">Try:</span>
          <button type="button" class="btn ghost sm" onclick="trSample()">a ghazal in casual Roman</button>
        </div>
        <span id="trBadge" class="tr-badge"></span>
      </div>
      <div id="trInBar" class="tr-in-bar">
        <span id="trInBarText" class="tr-in-bar-text"></span>
        <button type="button" id="trInBarBtn" class="btn sm" onclick="trEditInput()">Edit text</button>
      </div>
      <div class="tr-input-wrap">
        <textarea id="trIn" rows="3" class="scan-input tr-input-area vi-grow" spellcheck="false" autocapitalize="off" placeholder="Paste text in Roman, Urdu, Fārsī or Hindi, one line to a line" oninput="trOnInput()"></textarea>
      </div>
      <div class="tr-pane-foot tr-in-foot">
        <button type="button" id="trInClear" class="btn ghost sm tr-in-clear hidden" onclick="trClear()">Clear</button>
        <button type="button" id="trInDone" class="btn sm tr-in-done" onclick="trEditInput()">Done</button>
      </div>
    </div>

    <!-- Right Column: Target / Transliteration -->
    <div class="tr-col tr-col-out">
      <div class="tr-pane-head tr-controls tr-out-head">
        <div class="tr-script-switch" id="trScriptBtns" role="group" aria-label="Script to show"></div>
        <div class="tr-script-switch tr-style-switch hidden" id="trStyleBtns" role="group" aria-label="Roman style"></div>
        <div class="tr-script-switch tr-view-switch" id="trViewBtns" role="group" aria-label="Layout"></div>
        <span id="trMore" class="tr-more"></span>
      </div>

      <div class="tr-out-wrap">
        <div id="trOut" class="tr-out"></div>
      </div>

      <div class="tr-pane-foot tr-out-foot">
        <div id="trActions" class="tr-actions hidden">
          <button type="button" class="btn sm" onclick="trCopy()">Copy</button>
          <a id="trToScan" class="btn sm" href="#/scan">Scan<span class="tr-wide"> these lines</span> →</a>
          <span id="trStats" class="tiny faint tr-stats"></span>
          <span id="trMsg" class="tiny faint tr-msg" role="status" aria-live="polite"></span>
        </div>
        <p id="trLegend" class="tiny faint tr-legend tr-hint hidden">Tap an underlined word to see other spellings and dictionary meanings.</p>
        <p id="trLetters" class="tiny faint tr-legend hidden"></p>
      </div>
    </div>
  </div>

  <!-- Word Inspector: candidate spellings & dictionary for the active word -->
  <div id="trInspector" class="tr-inspector hidden"></div>

  <div id="trFixes"></div>
</section>
