
  <!-- Subtab 2: Drill -->
  <div id="meterPanelDrill" class="subpanel">
    <h2 class="sec">Drill 1</h2>
    <div class="card drill-card">
      <div class="drill-head">
        <h3 class="drill-title">In the bahr, or limping?</h3>
        <span class="mono tiny dim drill-score" id="iomScore">0 / 0</span>
      </div>
      <p class="small dim drill-prompt">A line is sung. Sometimes a syllable has been added, dropped or flipped. Judge by ear.</p>
      <div class="row">
        <button class="btn gold sm" onclick="iomPlay()">▶ Play</button>
        <button class="btn ghost sm" onclick="iomPlay()">↻ again</button>
      </div>
      <div class="strip drill-strip" id="iomStrip"></div>
      <div class="drill-answers-row">
        <button class="btn ghost drill-ans-btn" id="iomBtnIn" onclick="iomAns(true)">In ✓</button>
        <button class="btn ghost drill-ans-btn" id="iomBtnLimp" onclick="iomAns(false)">Limping ✗</button>
      </div>
      <div class="fb" id="iomFb"></div>
    </div>

    <h2 class="sec">Drill 2</h2>
    <div class="card drill-card">
      <div class="drill-head">
        <h3 class="drill-title">Which ghazal is this?</h3>
        <span class="mono tiny dim drill-score" id="wtScore">0 / 0</span>
      </div>
      <p class="small dim drill-prompt">Only the pulse plays. Pick the verse that rides on it.</p>
      <div class="row">
        <button class="btn gold sm" onclick="wtPlay()">▶ Play pulse</button>
      </div>
      <div id="wtChoices"></div>
      <div class="fb" id="wtFb"></div>
    </div>

    <div class="card tight small weak-card" id="weakCard"></div>

    <div class="go-deeper">
      <strong>Go deeper:</strong> <a href="#/handbook/ch8">Handbook ch. 8 — From Eye to Ear ›</a>
    </div>
  </div>
