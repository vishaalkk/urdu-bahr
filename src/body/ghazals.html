<!-- ===================== GHAZALS TAB ===================== -->
<section id="ghazals-section" class="tab-view">
  <div class="page-head ghazal-head">
    <div class="eyebrow sr-only" id="ghazalEyebrow">Ghazals</div>
    <h1 class="page-title sr-only">Ghazals</h1>
    <div class="lede dim small">Explore classical and modern ghazals grouped by bahr. Tap a group to open it.</div>

    <!-- Collection segmented control -->
    <div class="subtabs seg" role="tablist" aria-label="Collections">
      <button class="seg-btn on" id="colBtnHandbook" onclick="switchCollection('handbook')">Handbook</button>
      <button class="seg-btn" id="colBtnGhalib" onclick="switchCollection('ghalib')">Ghalib</button>
      <button class="seg-btn" id="colBtnMir" onclick="switchCollection('mir')">Mir</button>
      <button class="seg-btn" id="colBtnPoets" aria-haspopup="true" aria-expanded="false" aria-controls="poetPicker" onclick="togglePoetPicker()">Poets ▾</button>
    </div>
    <div id="poetPicker" class="poet-picker hidden">
      <input type="search" id="poetPickerFilter" class="poet-picker-filter" aria-label="Find a poet" placeholder="Filter poets by name…" autocomplete="off" oninput="renderPoetPickerList()">
      <div id="poetPickerList" class="poet-picker-list"></div>
    </div>

    <!-- One search for the whole tab: it covers every collection -->
    <input type="search" id="ghazalSearchInput" class="ghazal-search-input" aria-label="Search all ghazals" placeholder="Search ghazals or verses across all poets…" autocomplete="off" oninput="onGhazalSearch()">
    <div class="tiny dim col-filter-label" id="colFilterLabel" hidden>Showing matches from all collections. Pick one to narrow them.</div>

    <!-- Unified single meta bar for the active tab -->
    <div class="row ghazal-controls">
      <div id="colDesc" class="dim ghazal-desc"><span id="ghazalCollectionCount" class="ghazal-collection-count">24 ghazals</span> · <span id="colDescText">The handbook's exercise ghazals, with Frances Pritchett's notes. <a class="fran-link" href="https://franpritchett.com/00ghalib/meterbk/10_ex_01_06.html" target="_blank" rel="noopener">Her exercises<span class="ext">↗</span></a> · <a class="fran-link" href="https://franpritchett.com/00ghalib/meterbk/11_exnotes.html" target="_blank" rel="noopener">answers &amp; notes<span class="ext">↗</span></a></span></div>
    </div>
  </div>

  <!-- Ghazal Reader View (when viewing a specific ghazal) -->
  <div id="ghazalReaderView" class="ghazal-reader-view hidden">
    <div class="row reader-nav">
      <button class="btn link sm" onclick="navigate('/ghazals/' + (typeof activeCollection !== 'undefined' ? activeCollection : 'handbook'))">← Ghazals</button>
      <span id="readerTitle" class="small dim"></span>
    </div>
    <div id="readerHeader" class="reader-header"></div>
    <div id="readerIntroNote" class="note small reader-intro-note hidden"></div>
    <div id="readerCouplets" class="reader-couplets"></div>
    <div id="readerFooterNav" class="reader-footer-nav row"></div>
  </div>

  <!-- Ghazal List View -->
  <div id="ghazalListView">
    <!-- Universal search results (all collections, tagged); shown instead of
         the three containers below whenever the search box has a query. -->
    <div id="ghazalUniversalResults" class="verses hidden"></div>
    <button id="ghazalUniversalMore" class="btn ghost sm ghazal-more-btn hidden" onclick="showMoreUniversal()">Show 30 more</button>

    <!-- Handbook exercises list -->
    <div id="handbookExContainer">
      <div class="row hidden" id="exPoetChips"></div>
      <div id="exDetailView" class="verses"></div>
    </div>

    <!-- Ghalib container -->
    <div id="ghalibContainer" class="hidden">
      <div id="ghalibExtList" class="verses"></div>
      <button id="ghalibExtMore" class="btn ghost sm ghazal-more-btn hidden" onclick="showMoreGhalibExt()">Show 30 more</button>
    </div>

    <!-- Mir container -->
    <div id="mirContainer" class="hidden">
      <div id="mirExtList" class="verses"></div>
      <button id="mirExtMore" class="btn ghost sm ghazal-more-btn hidden" onclick="showMoreMirExt()">Show 30 more</button>
    </div>

    <!-- Poet container: one poet at a time, chosen from the Poets picker (Rekhta; the six hand-checked keep their verified Roman) -->
    <div id="poetsContainer" class="hidden">
      <div id="poetExtList" class="verses"></div>
      <button id="poetExtMore" class="btn ghost sm ghazal-more-btn hidden" onclick="showMorePoetExt()">Show 30 more</button>
    </div>
  </div>
</section>
