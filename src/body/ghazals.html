<!-- ===================== GHAZALS TAB ===================== -->
<section id="ghazals-section" class="tab-view">
  <!-- Poets rail: sits in the left margin on wide screens (CSS shows it only where the margin has room);
       elsewhere the "Poets ▾" tab opens the same list in #poetSheet. Inside the section, so it hides with it. -->
  <aside id="poetRail" class="poet-rail" aria-label="Poets">
    <div class="poet-rail-label">Poets</div>
    <input type="search" id="poetRailFilter" class="poet-find" aria-label="Find a poet" placeholder="Find a poet…" autocomplete="off" oninput="renderPoetLists()">
    <div id="poetRailList" class="poet-list"></div>
  </aside>

  <div class="page-head ghazal-head">
    <div class="eyebrow sr-only" id="ghazalEyebrow">Ghazals</div>
    <h1 class="page-title sr-only">Ghazals</h1>
    <div class="lede dim small">Ghazals grouped by bahr, each under a famous verse in it. Tap a group to open it; narrow by language or poet.</div>

    <!-- Filters: language, and (where there is no rail) the poet sheet -->
    <div class="subtabs seg ghazal-filters" id="ghazalFilters" role="group" aria-label="Filter ghazals"></div>

    <!-- One search for the whole tab; the filters above narrow it too -->
    <input type="search" id="ghazalSearchInput" class="ghazal-search-input" aria-label="Search all ghazals" placeholder="Search ghazals or verses across all poets…" autocomplete="off" oninput="onGhazalSearch()">

    <div id="ghazalStatus" class="dim ghazal-desc small"></div>
  </div>

  <!-- Ghazal Reader View (when viewing a specific ghazal) -->
  <div id="ghazalReaderView" class="ghazal-reader-view hidden">
    <div class="row reader-nav">
      <nav id="readerCrumbs" class="crumbs" aria-label="Breadcrumb"></nav>
      <span id="readerTitle" class="small dim"></span>
    </div>
    <div id="readerHeader" class="reader-header"></div>
    <div id="readerIntroNote" class="note small reader-intro-note hidden"></div>
    <div id="readerCouplets" class="reader-couplets"></div>
    <div id="readerFooterNav" class="reader-footer-nav row"></div>
  </div>

  <!-- Ghazal List View: every poet's ghazals under their bahr, narrowed by the filters and the search -->
  <div id="ghazalListView">
    <div id="ghazalList" class="verses"></div>
  </div>

  <!-- Poet sheet (phones and narrow screens): the settings-sheet surface -->
  <div class="sheet" id="poetSheet" role="dialog" aria-modal="true" aria-labelledby="poetSheetTitle" onclick="if(event.target===this)togglePoetSheet(false)">
    <div class="in poet-sheet-in">
      <div class="settings-head">
        <h3 id="poetSheetTitle">Poets</h3>
        <button class="icon-btn" onclick="togglePoetSheet(false)" aria-label="Close poets">✕</button>
      </div>
      <input type="search" id="poetSheetFilter" class="poet-find" aria-label="Find a poet" placeholder="Find a poet…" autocomplete="off" oninput="renderPoetLists()">
      <div id="poetSheetList" class="poet-list"></div>
    </div>
  </div>
</section>
