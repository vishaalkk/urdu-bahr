
  <!-- Subtab 3: Look up (Word Bank) -->
  <div id="weightPanelLookup" class="subpanel">
    <div class="card lookup-head-card">
      <h2 class="lookup-title">Word Bank</h2>
      <div class="dim small lookup-desc">Over 380 verified irregular words, alternative scansions, and spelling variants from Frances Pritchett's handbook.</div>
      <div class="row lookup-search-row">
        <input type="text" id="dictSearchInput" class="dict-search-input" placeholder="Search word, Roman transliteration, or meaning..." oninput="onDictSearch()">
      </div>
      <div class="row lookup-tag-row">
        <button class="tagbtn on" id="dictTagAll" onclick="filterDictTag('all')">All</button>
        <button class="tagbtn" id="dictTagFlex" onclick="filterDictTag('flex')">Flexible (x)</button>
        <button class="tagbtn" id="dictTagPersian" onclick="filterDictTag('persian')">Persian</button>
        <button class="tagbtn" id="dictTagIndic" onclick="filterDictTag('indic')">Indic</button>
      </div>
    </div>
    <div id="dictList" class="dict-list"></div>
    <div class="go-deeper card small">
      <span class="go-deeper-tag mono tiny">Go deeper</span>
      <p class="go-deeper-links"><a href="#/handbook/ch4">Handbook ch. 4 — Irregular Words &amp; Special Vocabulary ›</a></p>
    </div>
  </div>
</section>
